[workspace]
members = ["crates/litter-raft", "crates/litter-wire", "crates/litter-hub"]
# `.` (meow itself) only — NOT the litter-* members above — so a bare
# `cargo build`/`test` at this root (meow's own recipe: nightly,
# `-Zbuild-std=core,alloc`, `--target aarch64-unknown-linux-musl`) doesn't
# also try to cross-compile them for a target that has no `std` at all.
# `litter-hub` in particular is an ordinary `std` binary and would fail
# outright; run `cargo test -p <name> --target <host-triple>` (or `cd` into
# that crate's own directory and run `cargo test --target <host-triple>`) to
# test any of them natively instead — see each one's own Cargo.toml.
default-members = ["."]

[package]
name = "meow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "meow"
path = "src/main.rs"

[features]
default = ["compact-tools", "litter"]

# Drop every per-tool `description` from the OpenAI tools schema (~930 fewer
# tokens on every request). ON by default; disable with `--no-default-features`
# to ship the descriptive schema. See config.rs OPENAI_TOOLS_JSON.
compact-tools = []

# The inter-agent mailbox tools (LitterSend/LitterInbox/LitterPeers,
# tools/litter.rs) and the Raft-derived leader-election state machine
# (election.rs) — "litter" as in a litter of kittens, the group spawned
# together from one launch. ON by default — both are inert until
# `litter_agent_name` is set in /etc/meow/config, so shipping them costs
# schema tokens but no behavior change for a non-litter install. Disable with
# `--no-default-features` (or explicitly `--no-default-features --features
# compact-tools`) to drop them from the binary entirely. See
# docs/LITTER_EXPERIMENT.md.
litter = []

# Compile the in-binary self-test suite (`meow test`) and its capture hooks.
# OFF by default — the tests are dead weight in shipped builds. Enable with
# `--features tests` to build a binary that can run `meow test`.
tests = []

# Memory-constrained build: caps in-memory tool output at 2KB (vs 32KB default).
# Build with: cargo build --release --features size
size = []

# Use standard Linux socket syscalls for DNS (replaces Akuma-custom RESOLVE_HOST
# syscall 300). Enables meow to run in a stack=rump box where socket syscalls are
# intercepted by the kernel sysproxy and routed through the NetBSD rump TCP/IP stack.
# Also replaces UPTIME (319) with clock_gettime(CLOCK_MONOTONIC).
# Build with: cargo build --target aarch64-unknown-linux-musl --features linux-net
linux-net = ["libakuma/linux-abi"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
overflow-checks = false

[dependencies]
libakuma = { path = "../libakuma", features = ["chunked-allocator"] }
libakuma-tls = { path = "../libakuma-tls" }
# Raft's leader-election subprotocol, no_std + zero dependencies. Kept as a
# sibling crate (not inline) specifically so `cargo test` can exercise it
# natively on macOS, unlike the rest of meow — see litter-raft/src/lib.rs.
litter-raft = { path = "crates/litter-raft" }
# Wire format for the `litter-hub` TCP transport (tools/litter/hub.rs) — see
# litter-wire/src/lib.rs. Same "sibling crate for host-testability" reasoning
# as litter-raft, and shared with `litter-hub` itself so the two ends of the
# wire can't independently drift.
litter-wire = { path = "crates/litter-wire" }
# Ed25519 keys/signatures + sha256 for the relay envelope (origin/relayer
# signatures, dedup checksums) — same versions akuma-ssh-crypto pins (sshd
# uses the identical pair), no_std; default features off sheds the curve25519
# precomputed tables (~30 KB) and zeroize: a hub signs once per outbound
# chat, not a hot loop.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
# JSON. no_std, allocation-free, non-recursive pull parser — same choice and
# feature set `box` already made (see userspace/box/Cargo.toml): no floats
# needed for chat-API/tool-call JSON, and float-skip steps over one rather
# than failing the whole document.
picojson = { version = "0.2", default-features = false, features = ["int64", "float-skip"] }

# meow is its own workspace root (`[workspace]` at the top), so it does NOT
# inherit `userspace/Cargo.toml`'s `[patch.crates-io]` even though it depends on
# `libakuma-tls` by path. Without this line meow builds the shipped TLS stack
# against unpatched `embedded-tls` from the registry, and every HTTPS request to
# a host whose `supported_groups` hint contains an unknown code point — such as
# `api.z.ai` — fails with `TlsError::DecodeError`. Keep this rev identical to the
# one in `userspace/Cargo.toml`; two different revs is worse than one wrong one,
# because the two binaries would then disagree about TLS.
# `docs/archive/AMD64_TRASHCAN_ISSUES.md` §5.2.
[patch.crates-io]
embedded-tls = { git = "https://github.com/netoneko/embedded-tls", rev = "6721038ba5874587b432fd82011168e85fa166b5" }
